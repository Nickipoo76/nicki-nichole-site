<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0B1A34" />
        <title>Nicki Nichole | Lead Generation for Trust-Based Businesses</title>
        <meta
            name="description"
            content="Over a decade generating leads for trust-based businesses. Nicki Nichole helps tax pros, real estate agents and entrepreneurs attract more leads, convert them faster and keep clients coming back."
        />
        <link rel="canonical" href="https://nickinichole.com/" />
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Nicki Nichole" />
        <meta property="og:title" content="Nicki Nichole | Lead Generation for Trust-Based Businesses" />
        <meta
            property="og:description"
            content="Over a decade generating leads for trust-based businesses. Nicki Nichole helps tax pros, real estate agents and entrepreneurs attract more leads, convert them faster and keep clients coming back."
        />
        <meta property="og:url" content="https://nickinichole.com/" />
        <meta property="og:image" content="https://nickinichole.com/images/og-image.jpg" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Nicki Nichole | Lead Generation for Trust-Based Businesses" />
        <meta
            name="twitter:description"
            content="Over a decade generating leads for trust-based businesses. Nicki Nichole helps tax pros, real estate agents and entrepreneurs attract more leads, convert them faster and keep clients coming back."
        />
        <meta name="twitter:image" content="https://nickinichole.com/images/og-image.jpg" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&display=swap"
            rel="stylesheet"
        />

        <!-- Structured data -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Person",
                "name": "Nichole Paul",
                "alternateName": "Nicki Nichole",
                "url": "https://nickinichole.com",
                "jobTitle": "Marketing Consultant",
                "image": "https://nickinichole.com/images/headshot-main.jpg",
                "sameAs": [
                    "https://www.instagram.com/accelerate.marketing/",
                    "https://www.linkedin.com/in/nicholepaul"
                ]
            }
        </script>

        <!-- Hidden form so Netlify Forms registers the contact form at build time -->
        <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
            <input type="text" name="name" />
            <input type="email" name="email" />
            <select name="topic"></select>
            <textarea name="message"></textarea>
        </form>
        <form name="lead-leak-score" data-netlify="true" netlify-honeypot="bot-field" hidden>
            <input type="email" name="email" />
            <input type="text" name="score" />
            <input type="text" name="leaks" />
        </form>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
