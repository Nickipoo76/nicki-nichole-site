[build]
  base = "frontend"
  command = "yarn build"
  publish = "build"
  # Only rebuild when the bio site itself changed (saves Netlify credits)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[[redirects]]
  from = "/lead-leak-score"
  to = "https://accelerate-lead-tools.netlify.app/lead-leak-score"
  status = 301
  force = true

[[redirects]]
  from = "/lead-calculator"
  to = "https://accelerate-lead-tools.netlify.app/lead-calculator"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
