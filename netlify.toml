[build]
  base = "frontend"
  command = "yarn build"
  publish = "build"

[[redirects]]
  from = "/lead-leak-score"
  to = "https://accelerate-free-tools.netlify.app/lead-leak-score"
  status = 301
  force = true

[[redirects]]
  from = "/lead-calculator"
  to = "https://accelerate-free-tools.netlify.app/lead-calculator"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
