[build]
  publish = "."
  command = ""
  # Only rebuild when this folder changed (saves Netlify credits)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# Shareable link: /quote (and /quote/) shows the calculator
[[redirects]]
  from = "/quote"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/quote/"
  to = "/index.html"
  status = 200
